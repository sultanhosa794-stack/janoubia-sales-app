name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract latest project
        run: |
          rm -rf appsrc
          mkdir -p appsrc
          unzip -o mawzafeen-aljanoubia-v2-final-admin-tools.zip.zip -d appsrc

          echo "===== PROJECT FILES ====="
          find appsrc -maxdepth 4 -type f | head -100

      - name: Fix MainActivity and login support
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          file = Path(
              "appsrc/app/src/main/java/com/janoubia/sales/MainActivity.java"
          )

          if not file.exists():
              raise SystemExit(
                  "ERROR: MainActivity.java not found at expected path"
              )

          text = file.read_text(encoding="utf-8")

          print("===== ORIGINAL MAINACTIVITY =====")
          print(text[:4000])

          # --------------------------------------------------
          # 1. Make MainActivity compatible with FragmentActivity
          # --------------------------------------------------

          text = re.sub(
              r'public\s+class\s+MainActivity\s+extends\s+'
              r'(?:Activity|AppCompatActivity|FragmentActivity)',
              'public class MainActivity extends FragmentActivity',
              text,
              count=1
          )

          package_match = re.search(
              r'^package\s+[^;]+;\s*',
              text,
              flags=re.MULTILINE
          )

          if not package_match:
              raise SystemExit("ERROR: package declaration not found")

          required_imports = [
              "import androidx.fragment.app.FragmentActivity;",
              "import android.os.Build;",
              "import android.webkit.CookieManager;",
              "import android.webkit.WebSettings;",
              "import android.webkit.WebView;",
              "import android.webkit.WebViewClient;",
          ]

          missing_imports = []

          for imp in required_imports:
              if imp not in text:
                  missing_imports.append(imp)

          if missing_imports:
              pos = package_match.end()
              block = "\n" + "\n".join(missing_imports) + "\n"
              text = text[:pos] + block + text[pos:]

          # --------------------------------------------------
          # 2. Remove broken code from previous attempts
          # --------------------------------------------------

          text = re.sub(
              r'^\s*(?:android\.webkit\.)?WebView\s+webView\s*='
              r'\s*findViewById\(R\.id\.webview\);\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'\s*// JAN_LOGIN_FIX_START.*?'
              r'// JAN_LOGIN_FIX_END\s*',
              '\n',
              text,
              flags=re.DOTALL
          )

          # --------------------------------------------------
          # 3. Find the REAL programmatically-created WebView
          # --------------------------------------------------

          real_webview_pattern = (
              r'\bwebView\s*=\s*new\s+'
              r'(?:android\.webkit\.)?WebView\s*'
              r'\(\s*this\s*\)\s*;'
          )

          real_webview = re.search(
              real_webview_pattern,
              text
          )

          if not real_webview:
              raise SystemExit(
                  "ERROR: Real WebView creation not found in MainActivity"
              )

          # --------------------------------------------------
          # 4. Add WebView settings needed by login/session
          # --------------------------------------------------

          login_fix = r'''

              // JAN_LOGIN_FIX_START

              WebSettings janSettings = webView.getSettings();

              janSettings.setJavaScriptEnabled(true);
              janSettings.setDomStorageEnabled(true);
              janSettings.setDatabaseEnabled(true);

              janSettings.setJavaScriptCanOpenWindowsAutomatically(true);
              janSettings.setSupportMultipleWindows(false);

              janSettings.setLoadWithOverviewMode(true);
              janSettings.setUseWideViewPort(true);

              janSettings.setCacheMode(
                  WebSettings.LOAD_DEFAULT
              );

              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                  janSettings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  );
              }

              CookieManager janCookies =
                  CookieManager.getInstance();

              janCookies.setAcceptCookie(true);

              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                  janCookies.setAcceptThirdPartyCookies(
                      webView,
                      true
                  );
              }

              janCookies.flush();

              // JAN_LOGIN_FIX_END
          '''

          text, count = re.subn(
              '(' + real_webview_pattern + ')',
              lambda m: m.group(1) + login_fix,
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not inject WebView login settings"
              )

          # --------------------------------------------------
          # 5. Make sure cookies persist after pages load
          # --------------------------------------------------

          if "onPageFinished" in text:
              page_finished_pattern = (
                  r'(public\s+void\s+onPageFinished\s*'
                  r'\(\s*WebView\s+\w+\s*,\s*'
                  r'String\s+\w+\s*\)\s*\{)'
              )

              if not re.search(
                  r'onPageFinished[\s\S]{0,500}'
                  r'CookieManager\.getInstance\(\)\.flush',
                  text
              ):
                  text = re.sub(
                      page_finished_pattern,
                      r'\1\n'
                      r'                '
                      r'CookieManager.getInstance().flush();',
                      text,
                      count=1
                  )

          # --------------------------------------------------
          # 6. Save repaired MainActivity
          # --------------------------------------------------

          text = re.sub(
              r'\n{4,}',
              '\n\n\n',
              text
          )

          file.write_text(
              text,
              encoding="utf-8"
          )

          # --------------------------------------------------
          # 7. Validate critical login requirements
          # --------------------------------------------------

          checks = {
              "FragmentActivity":
                  "extends FragmentActivity" in text,

              "FragmentActivity import":
                  "import androidx.fragment.app.FragmentActivity;" in text,

              "JavaScript enabled":
                  "setJavaScriptEnabled(true)" in text,

              "DOM storage enabled":
                  "setDomStorageEnabled(true)" in text,

              "Database enabled":
                  "setDatabaseEnabled(true)" in text,

              "Cookies enabled":
                  "setAcceptCookie(true)" in text,

              "Third party cookies":
                  "setAcceptThirdPartyCookies" in text,

              "Real WebView":
                  bool(
                      re.search(
                          real_webview_pattern,
                          text
                      )
                  ),

              "No broken R.id.webview":
                  "R.id.webview" not in text,
          }

          print("===== LOGIN VALIDATION =====")

          failed = []

          for name, ok in checks.items():
              print(
                  name + ":",
                  "OK" if ok else "FAILED"
              )

              if not ok:
                  failed.append(name)

          if failed:
              raise SystemExit(
                  "ERROR: Validation failed: "
                  + ", ".join(failed)
              )

          print("===== MAINACTIVITY FIX COMPLETE =====")
          PY

      - name: Verify Android Manifest
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path(
              "appsrc/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found"
              )

          text = manifest.read_text(
              encoding="utf-8"
          )

          if "android.permission.INTERNET" not in text:
              raise SystemExit(
                  "ERROR: INTERNET permission missing"
              )

          print("AndroidManifest INTERNET permission: OK")
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Enable AndroidX
        working-directory: appsrc
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Restore signing key
        run: |
          echo "${{ secrets.JAN_SIGNING_KEYSTORE_B64 }}" \
          | base64 -d \
          > "$RUNNER_TEMP/mawzafeen-aljanoubia-release.jks"

          echo "JAN_SIGNING_STORE=$RUNNER_TEMP/mawzafeen-aljanoubia-release.jks" \
          >> "$GITHUB_ENV"

          echo "JAN_SIGNING_STORE_PASSWORD=${{ secrets.JAN_SIGNING_STORE_PASSWORD }}" \
          >> "$GITHUB_ENV"

          echo "JAN_SIGNING_KEY_ALIAS=${{ secrets.JAN_SIGNING_KEY_ALIAS }}" \
          >> "$GITHUB_ENV"

          echo "JAN_SIGNING_KEY_PASSWORD=${{ secrets.JAN_SIGNING_KEY_PASSWORD }}" \
          >> "$GITHUB_ENV"

      - name: Compile Java first
        working-directory: appsrc
        run: |
          gradle :app:compileReleaseJavaWithJavac --stacktrace

      - name: Build signed release APK
        working-directory: appsrc
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Verify APK exists
        run: |
          APK="appsrc/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "===== APK GENERATED ====="
          ls -lh "$APK"

      - name: Prepare APK
        run: |
          cp \
          appsrc/app/build/outputs/apk/release/app-release.apk \
          Mawzafeen-Aljanoubia.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Mawzafeen-Aljanoubia-APK
          path: Mawzafeen-Aljanoubia.apk
          if-no-files-found: error
