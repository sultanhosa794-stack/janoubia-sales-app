name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract latest project
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -o mawzafeen-aljanoubia-v2-final-admin-tools.zip -d appsrc

      - name: Fix MainActivity for biometric
        run: |
          FILE="appsrc/app/src/main/java/com/janoubia/sales/MainActivity.java"
          sed -i 's/public class MainActivity extends Activity/public class MainActivity extends FragmentActivity/' "$FILE"
          sed -i 's/public class MainActivity extends AppCompatActivity/public class MainActivity extends FragmentActivity/' "$FILE"
          grep -q "androidx.fragment.app.FragmentActivity" "$FILE" || sed -i '/^package /a import androidx.fragment.app.FragmentActivity;' "$FILE"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Enable AndroidX
        working-directory: appsrc
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Restore signing key
        run: |
          echo "${{ secrets.JAN_SIGNING_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/mawzafeen-aljanoubia-release.jks"
          echo "JAN_SIGNING_STORE=$RUNNER_TEMP/mawzafeen-aljanoubia-release.jks" >> "$GITHUB_ENV"
          echo "JAN_SIGNING_STORE_PASSWORD=${{ secrets.JAN_SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "JAN_SIGNING_KEY_ALIAS=${{ secrets.JAN_SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "JAN_SIGNING_KEY_PASSWORD=${{ secrets.JAN_SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: appsrc
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: cp appsrc/app/build/outputs/apk/release/app-release.apk Mawzafeen-Aljanoubia.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Mawzafeen-Aljanoubia-APK
          path: Mawzafeen-Aljanoubia.apk
          if-no-files-found: error
