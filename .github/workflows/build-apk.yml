# JANoubia FINAL - GPS + shifts + device binding + admin controls + updater
name: Build Final Janoubia APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf appsrc
          mkdir -p appsrc
          unzip -o mawzafeen-aljanoubia-v2-final-admin-tools.zip.zip -d appsrc

      - name: Apply Janoubia final native fixes
        env:
          JAN_BUILD_NUMBER: ${{ github.run_number }}
        run: python3 .github/scripts/patch_janoubia.py

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Enable AndroidX
        working-directory: appsrc
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Restore original signing key
        run: |
          echo "${{ secrets.JAN_SIGNING_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/janoubia-release.jks"
          echo "JAN_SIGNING_STORE=$RUNNER_TEMP/janoubia-release.jks" >> "$GITHUB_ENV"
          echo "JAN_SIGNING_STORE_PASSWORD=${{ secrets.JAN_SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "JAN_SIGNING_KEY_ALIAS=${{ secrets.JAN_SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "JAN_SIGNING_KEY_PASSWORD=${{ secrets.JAN_SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Compile release Java
        working-directory: appsrc
        run: |
          gradle :app:compileReleaseJavaWithJavac --stacktrace

      - name: Build signed release APK
        working-directory: appsrc
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Prepare final APK
        run: |
          APK="appsrc/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" Janoubia-Sales-2.apk
          ls -lh Janoubia-Sales-2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Janoubia-Sales-2-Final
          path: Janoubia-Sales-2.apk
          if-no-files-found: error

      - name: Publish update for installed apps
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Janoubia Sales 2 - Update ${{ github.run_number }}"
          files: Janoubia-Sales-2.apk
          make_latest: true
          generate_release_notes: false
