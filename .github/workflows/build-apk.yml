name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract latest project
        run: |
          rm -rf appsrc
          mkdir -p appsrc
          unzip -o mawzafeen-aljanoubia-v2-final-admin-tools.zip.zip -d appsrc

      - name: Fix MainActivity and login support
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          file = Path("appsrc/app/src/main/java/com/janoubia/sales/MainActivity.java")

          if not file.exists():
              raise SystemExit("MainActivity.java not found")

          text = file.read_text(encoding="utf-8")

          # Fix Activity type for BiometricPrompt
          text = re.sub(
              r'public\s+class\s+MainActivity\s+extends\s+(?:Activity|AppCompatActivity|FragmentActivity)',
              'public class MainActivity extends FragmentActivity',
              text,
              count=1
          )

          if "import androidx.fragment.app.FragmentActivity;" not in text:
              package_match = re.search(
                  r'^package\s+[^;]+;\s*',
                  text,
                  flags=re.MULTILINE
              )

              if not package_match:
                  raise SystemExit("Package declaration not found")

              pos = package_match.end()
              text = (
                  text[:pos]
                  + "\nimport androidx.fragment.app.FragmentActivity;\n"
                  + text[pos:]
              )

          required_imports = [
              "import android.os.Build;",
              "import android.webkit.CookieManager;",
              "import android.webkit.WebSettings;",
              "import android.webkit.WebView;",
              "import android.webkit.WebViewClient;",
          ]

          package_match = re.search(
              r'^package\s+[^;]+;\s*',
              text,
              flags=re.MULTILINE
          )

          if not package_match:
              raise SystemExit("Package declaration missing")

          additions = ""

          for imp in required_imports:
              if imp not in text:
                  additions += "\n" + imp

          if additions:
              pos = package_match.end()
              text = text[:pos] + additions + "\n" + text[pos:]

          # Remove only broken code from previous attempts
          text = re.sub(
              r'^\s*android\.webkit\.WebView webView\s*=\s*findViewById\(R\.id\.webview\);\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^\s*android\.webkit\.WebView webView\s*=\s*new android\.webkit\.WebView\(this\);\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # Remove our own previous login block if rerun
          text = re.sub(
              r'\s*// JAN_LOGIN_FIX_START.*?// JAN_LOGIN_FIX_END\s*',
              '\n',
              text,
              flags=re.DOTALL
          )

          # Verify the app's real WebView exists
          real_webview = re.search(
              r'\bwebView\s*=\s*new\s+(?:android\.webkit\.)?WebView\s*\(\s*this\s*\)\s*;',
              text
          )

          if not real_webview:
              raise SystemExit("Real application WebView not found")

          login_fix = r'''
                  // JAN_LOGIN_FIX_START

                  WebSettings janLoginSettings = webView.getSettings();

                  janLoginSettings.setJavaScriptEnabled(true);
                  janLoginSettings.setDomStorageEnabled(true);
                  janLoginSettings.setDatabaseEnabled(true);
                  janLoginSettings.setJavaScriptCanOpenWindowsAutomatically(true);
                  janLoginSettings.setSupportMultipleWindows(false);
                  janLoginSettings.setLoadWithOverviewMode(true);
                  janLoginSettings.setUseWideViewPort(true);
                  janLoginSettings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      janLoginSettings.setMixedContentMode(
                          WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                      );
                  }

                  CookieManager janCookieManager = CookieManager.getInstance();
                  janCookieManager.setAcceptCookie(true);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      janCookieManager.setAcceptThirdPartyCookies(
                          webView,
                          true
                      );
                  }

                  janCookieManager.flush();

                  // JAN_LOGIN_FIX_END
          '''

          text, count = re.subn(
              r'(\bwebView\s*=\s*new\s+(?:android\.webkit\.)?WebView\s*\(\s*this\s*\)\s*;)',
              lambda m: m.group(1) + "\n" + login_fix,
              text,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not inject login fix")

          # Flush cookies when page finishes
          if "CookieManager.getInstance().flush();" not in text[
              text.find("onPageFinished") if "onPageFinished" in text else 0:
          ]:
              text = re.sub(
                  r'(public\s+void\s+onPageFinished\s*\(\s*WebView\s+\w+\s*,\s*String\s+\w+\s*\)\s*\{)',
                  r'\1\n                CookieManager.getInstance().flush();',
                  text,
                  count=1
              )

          # Keep formatting clean
          text = re.sub(r'\n{4,}', '\n\n\n', text)

          file.write_text(text, encoding="utf-8")

          print("===== VERIFY MAINACTIVITY =====")

          checks = {
              "FragmentActivity":
                  "extends FragmentActivity" in text,

              "FragmentActivity import":
                  "import androidx.fragment.app.FragmentActivity;" in text,

              "JavaScript":
                  "setJavaScriptEnabled(true)" in text,

              "DOM storage":
                  "setDomStorageEnabled(true)" in text,

              "Database":
                  "setDatabaseEnabled(true)" in text,

              "Cookies":
                  "setAcceptCookie(true)" in text,

              "Third-party cookies":
                  "setAcceptThirdPartyCookies" in text,

              "Real WebView":
                  bool(re.search(
                      r'\bwebView\s*=\s*new\s+(?:android\.webkit\.)?WebView',
                      text
                  )),

              "No broken R.id.webview":
                  "R.id.webview" not in text,
          }

          failed = []

          for name, ok in checks.items():
              print(name, "OK" if ok else "FAILED")

              if not ok:
                  failed.append(name)

          if failed:
              raise SystemExit(
                  "Validation failed: " + ", ".join(failed)
              )

          print("MainActivity validation passed.")
          PY

      - name: Verify Android Manifest
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("appsrc/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          text = manifest.read_text(encoding="utf-8")

          if "android.permission.INTERNET" not in text:
              raise SystemExit("INTERNET permission missing")

          print("AndroidManifest OK")
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Enable AndroidX
        working-directory: appsrc
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Restore signing key
        run: |
          echo "${{ secrets.JAN_SIGNING_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/mawzafeen-aljanoubia-release.jks"

          echo "JAN_SIGNING_STORE=$RUNNER_TEMP/mawzafeen-aljanoubia-release.jks" >> "$GITHUB_ENV"
          echo "JAN_SIGNING_STORE_PASSWORD=${{ secrets.JAN_SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "JAN_SIGNING_KEY_ALIAS=${{ secrets.JAN_SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "JAN_SIGNING_KEY_PASSWORD=${{ secrets.JAN_SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Compile Java
        working-directory: appsrc
        run: |
          gradle :app:compileReleaseJavaWithJavac --stacktrace

      - name: Build signed release APK
        working-directory: appsrc
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Verify APK exists
        run: |
          APK="appsrc/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          ls -lh "$APK"

      - name: Prepare APK
        run: |
          cp appsrc/app/build/outputs/apk/release/app-release.apk Mawzafeen-Aljanoubia.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Mawzafeen-Aljanoubia-APK
          path: Mawzafeen-Aljanoubia.apk
          if-no-files-found: error
