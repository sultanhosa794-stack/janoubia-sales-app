name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -o janoubia-sales-app.zip -d appsrc

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: appsrc
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp appsrc/app/build/outputs/apk/debug/app-debug.apk Janoubia-Sales.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Janoubia-Sales-APK
          path: Janoubia-Sales.apk
          if-no-files-found: error
